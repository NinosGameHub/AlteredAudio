<!-- @template name="Altered Audio — Filter 76 Plugin Window" description="Filter 76 starter shell: header, spectrum display, filter cluster & system footer to build a filter UI on." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Filter — Plugin Window</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0a09;
    background-image: radial-gradient(140% 120% at 50% 0%, #1a1815 0%, #0b0a09 70%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #stage { transform-origin: center center; }
  #plugin {
    width: 1400px; height: 760px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: var(--surface-base);
    background-image: linear-gradient(to bottom, rgba(255,253,247,0.5), rgba(255,253,247,0) 120px);
    border-radius: var(--radius-xl); border: 1px solid #000;
    box-shadow: var(--shadow-bezel), 0 1px 0 rgba(255,255,255,0.4) inset; overflow: hidden;
  }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel" data-presets="react">
  function mount() {
    const DS = window.AuroraFilterDesignSystem_83b750;
    if (!DS) { return setTimeout(mount, 60); }
    const { SpectrumDisplay, OptionList, Knob, Panel, SegmentedControl, Readout, PowerButton, LED } = DS;
    const fmtHz = (f) => (f >= 1000 ? (f / 1000).toFixed(2) + " kHz" : Math.round(f) + " Hz");

    function Shell() {
      const [f, setF] = React.useState({ type: "LP", freq: 800, q: 6.0, drive: 3.0, mix: 100, output: 0 });
      const [power, setPower] = React.useState(true);
      const set = (p) => setF((s) => ({ ...s, ...p }));
      return (
        <div id="plugin">
          <header style={{ display: "flex", alignItems: "center", gap: "24px", height: "56px", padding: "0 6px" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              <div className="af-wordmark" style={{ fontSize: "24px", lineHeight: 1 }}>ALTERED AUDIO</div>
              <div style={{ fontFamily: "var(--font-display)", fontSize: "11px", letterSpacing: "var(--tracking-wide)", textTransform: "uppercase", color: "var(--accent-amber-active)" }}>FILTER 76</div>
            </div>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: "22px" }}>
              <Readout label="MIX" labelPlacement="top" value={Math.round(f.mix) + " %"} size="sm" />
              <PowerButton on={power} onChange={setPower} />
            </div>
          </header>

          <div style={{ position: "relative", flex: "0 0 300px" }}>
            <SpectrumDisplay type={f.type} freq={f.freq} q={f.q} slope={24} height="100%"
              showSpectrum={false}
              onNodeChange={(n) => set({ freq: n.freq, q: n.q })} />
          </div>

          <div style={{ display: "flex", gap: "14px", flex: 1 }}>
            <Panel title="FILTER TYPE" style={{ flex: "0 0 150px" }}>
              <OptionList value={f.type} onChange={(v) => set({ type: v })}
                options={["LP", "HP", "BP", "NOTCH", "PEAK", "SHELF"]} />
            </Panel>
            <Panel style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "space-around" }}>
              <Knob face label="FREQ · HZ" value={f.freq} min={20} max={20000} defaultValue={1000}
                display={Math.round(f.freq)} onChange={(v) => set({ freq: v })} />
              <Knob face label="RES · Q" value={f.q} min={0.1} max={24} defaultValue={0.7}
                display={f.q.toFixed(1)} onChange={(v) => set({ q: v })} />
              <Knob face label="DRIVE · DB" value={f.drive} min={0} max={24} defaultValue={0}
                display={f.drive.toFixed(1)} onChange={(v) => set({ drive: v })} />
              <Knob face label="MIX · %" value={f.mix} min={0} max={100} defaultValue={100}
                display={Math.round(f.mix)} onChange={(v) => set({ mix: v })} />
              <Knob face label="OUT · DB" value={f.output} min={-24} max={24} defaultValue={0} bipolar
                display={f.output.toFixed(1)} onChange={(v) => set({ output: v })} />
            </Panel>
          </div>

          <footer style={{ display: "flex", alignItems: "center", gap: "28px", height: "40px", padding: "0 14px",
            background: "var(--surface-panel)", border: "var(--border-default)", borderRadius: "var(--radius-md)" }}>
            <LED on label="SYSTEM" />
            <span style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--text-primary)" }}>44.1 kHz · 1x · 0.00 ms</span>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "baseline", gap: "24px" }}>
              <span style={{ display: "inline-flex", alignItems: "baseline", gap: "10px" }}>
                <span className="af-label" style={{ fontSize: "9px" }}>SIGNAL PATH</span>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: "12px", fontWeight: 500, color: "var(--text-primary)" }}>STEREO</span>
              </span>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--text-muted)" }}>v0.7.6</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Shell />);
    function fit() {
      const s = document.getElementById("stage");
      const sc = Math.min(window.innerWidth / 1400, window.innerHeight / 760, 1);
      s.style.transform = "scale(" + sc + ")";
    }
    window.addEventListener("resize", fit);
    fit(); setTimeout(fit, 300);
  }
  mount();
</script>
</body>
</html>
